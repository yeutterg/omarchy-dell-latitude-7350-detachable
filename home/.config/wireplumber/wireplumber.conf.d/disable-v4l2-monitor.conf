# Dell Latitude 7350 Detachable (Intel IPU6 camera) workaround.
#
# With intel-ipu7-camera's WirePlumber rules installed, the V4L2 monitor's
# handling of the ~48 raw IPU6 nodes stalls WirePlumber's event queue. Every
# later event then waits behind it: the sound card stays on the "off" profile,
# no default output is chosen, and streams are never linked (no sound).
#
# Disabling the V4L2 monitor restores audio. Cost: cameras are not exposed as
# PipeWire nodes. Apps that open /dev/video* directly are unaffected.
# Remove this file once WirePlumber or intel-ipu7-camera is fixed.
wireplumber.profiles = {
  main = {
    monitor.v4l2 = disabled
  }
}
