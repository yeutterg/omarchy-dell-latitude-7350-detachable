# Dell Latitude 7350 Detachable: keep the internal mic (rt713 DMIC, PCM 4)
# closed.
#
# After a suspend/resume the DMIC codec can fail to wake (kernel:
# "rt712-sdca-dmic ... ASoC error (-61)"). Opening it then jams the card: the
# UCM "HiFi" profile disappears, only "off"/"Pro Audio" remain, and there is no
# speaker or headphone output until a reboot. intel-ipu7-camera restarts
# WirePlumber on every resume, which re-opens the mic and triggers this.
#
# Disabling the node means nothing can open it. Cost: no internal mic (the
# headset jack mic, PCM 1, still works). Remove once the kernel fixes the DMIC
# resume.
monitor.alsa.rules = [
  {
    matches = [
      {
        alsa.card_name = "sof-soundwire"
        alsa.device = "4"
      }
    ]
    actions = {
      update-props = {
        node.disabled = true
      }
    }
  }
]
