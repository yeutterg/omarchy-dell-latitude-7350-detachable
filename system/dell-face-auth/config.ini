[core]
detection_notice = false
timeout_notice = true
no_confirmation = true
suppress_unknown = true
abort_if_ssh = true
abort_if_lid_closed = false
disabled = false
use_cnn = false
workaround = off

[video]
recording_plugin = ir_libcamera
device_path = /dev/null
ir_grab_path = /usr/local/libexec/dell-ir-grab
ir_camera = \_SB_.PC00.LNK0
ir_auto_exposure = true
ir_gain = 16
ir_exposure = 2000
ir_black_level = 64
ir_max_exposure = 12000
ir_target = 256
certainty = 3.5
timeout = 6
max_height = 480
frame_width = 640
frame_height = 480
dark_threshold = 60
rotate = 1
force_mjpeg = false
warn_no_device = true

[snapshots]
save_failed = false
save_successful = false

[rubberstamps]
enabled = false
